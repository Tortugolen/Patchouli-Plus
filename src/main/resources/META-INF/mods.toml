modLoader= "javafml" 
loaderVersion= "${loader_version_range}"
license= "${mod_license}"

issueTrackerURL = "${mod_issueTrackerURL}"
showAsResourcePack = false
showAsDataPack = false

[[mods]]
modId= "${mod_id}"
displayName= "${mod_name}"
version= "${mod_version}"
authors= "${mod_authors}"
credits = "Patchouli (Vazkii)"
description= "${mod_description}"
logoFile= "${mod_logo_file}"
displayURL = "${mod_displayURL}"
logoBlur = false

[[dependencies."${mod_id}"]]
modId= "minecraft"
mandatory= true
versionRange= "${minecraft_version_range}"
ordering= "NONE"
side= "BOTH"

[[dependencies."${mod_id}"]]
modId= "forge" 
mandatory= true 
versionRange= "${forge_version_range}"
ordering= "NONE"
side= "BOTH"

[[dependencies."${mod_id}"]]
modId= "patchouli"
mandatory= true
versionRange= "${patchouli_version_range}"
ordering= "NONE"
side= "BOTH"